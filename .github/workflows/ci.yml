name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The sync engine is the Eidolon core's (kumbukumbu, packages/eidolon-core): the copy must be the commit's.
      - run: pnpm vendor --check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
